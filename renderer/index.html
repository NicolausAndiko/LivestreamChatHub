<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
<title>Livestream Chat Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_copy,delete,done_all" />
<link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <div class="window">
        <header class="titlebar">
            <div class="titlebar-left">
                <img
                    class="titlebar-icon"
                    src="../assets/icon.ico"
                    alt="Livestream Chat Hub">
                <span class="titlebar-title">
                    Livestream Chat Hub
                </span>
            </div>
            <div class="titlebar-right">
                <button
                    id="settings-button"
                    class="btn btn-icon titlebar-button"
                    title="Settings">
                    ⚙
                </button>
                <button
                    id="help-button"
                    class="btn btn-icon titlebar-button"
                    title="Help">
                    ?
                </button>
            </div>
        </header>

        <main class="main-layout">
            <section class="left-column">
                <section class="panel">
                    <div class="panel-header">
                        <div class="panel-header-left">
                            <h2 class="panel-title">
                                Connections
                            </h2>
                            <span class="panel-subtitle">
                                Manage streaming platform connections.
                            </span>
                        </div>
                        <div class="panel-header-right">
                            <button
                                id="add-platform"
                                class="btn btn-primary">
                                ＋ Add Platform
                            </button>
                        </div>
                    </div>
                    <div
                        id="platform-list"
                        class="panel-body">
                    </div>
                </section>
                <section class="panel">
                    <div class="panel-header">
                        <div class="panel-header-left">
                            <h2 class="panel-title">
                                Emote Manager
                            </h2>
                            <span class="panel-subtitle">
                                Manage GIFs, stickers and reactions.
                            </span>
                        </div>
                        <div class="panel-header-right">
                            <span
                                id="emote-count"
                                class="badge badge-secondary">
                                0 Emotes
                            </span>
                        </div>
                    </div>
                    <div class="panel-footer">
                        <button
                            id="manage-emotes"
                            class="btn btn-primary">
                            ＋ Manage Emotes
                        </button>
                    </div>
                </section>
                <section
                    class="panel overlay"
                    id="overlay-panel"
                    data-status="stopped">
                    <div class="panel-header">
                        <div class="panel-header-left">
                            <h2 class="panel-title">
                                Overlay Server
                            </h2>
                            <span class="panel-subtitle">
                                Local overlay server for OBS.
                            </span>
                        </div>
                        <div class="panel-header-right">
                            <span
                                id="overlay-status"
                                class="badge badge-danger">
                                Stopped
                            </span>
                        </div>
                    </div>
                    <div class="panel-body overlay-body">
                        <div class="overlay-url">
                            <input
                                id="overlay-url"
                                class="input"
                                type="text"
                                readonly
                                value="http://localhost:3000">
                            <button
                                id="copy-overlay-url"
                                class="btn btn-secondary">
                                <span class="material-symbols-outlined">content_copy</span>
                                Copy
                            </button>
                        </div>
                        <div class="overlay-actions">
                            <button
                                id="start-overlay"
                                class="btn btn-success">
                                Start
                            </button>
                            <button
                                id="stop-overlay"
                                class="btn btn-danger">
                                Stop
                            </button>
                        </div>
                    </div>
                </section>
            </section>
            <aside class="right-column">
                <section class="panel panel-fit">
                    <div class="panel-header">
                        <div class="panel-header-left">
                            <h2 class="panel-title">
                                System Log
                            </h2>
                            <span class="panel-subtitle">
                                Monitor application events and live chat activity.
                            </span>
                        </div>
                    </div>
                    <div
                        id="log-panel"
                        class="panel-body log">
                        <div class="log-empty">
                            No log available.
                        </div>
                    </div>
                </section>
            </aside>
        </main>

        <footer class="footer">
            <div class="footer-left">
                <div class="footer-item">
                    <strong>
                        Status
                    </strong>

                    <div
                        id="application-status"
                        class="footer-status"
                        data-status="online">
                        <span class="footer-status-dot"></span>
                        <span>
                            Ready
                        </span>
                    </div>
                </div>
                <div class="footer-divider"></div>
                <div class="footer-item">
                    <strong>
                        Version
                    </strong>
                    <span
                        id="application-version"
                        class="footer-version">
                        v3.0.1
                    </span>
                </div>
            </div>
            <div
                id="footer-platforms"
                class="footer-center footer-platforms">
            </div>
            <!-- <div class="footer-right">
                <div class="footer-item">
                    <strong>
                        Overlay
                    </strong>
                    <span
                        id="footer-overlay-status">
                        Stopped
                    </span>
                </div>
            </div> -->
        </footer>
    </div>

    <template id="platform-template">
        <div
            class="platform"
            data-platform=""
            data-status="disconnected">
            <div class="platform-header">
                <div class="platform-info">
                    <div class="platform-icon">
                        <img
                            src=""
                            alt="Platform Icon">
                    </div>
                    <div class="platform-content">
                        <div class="platform-name">
                            Platform
                        </div>
                        <div class="platform-description">
                            Description
                        </div>
                    </div>
                </div>
                <div class="platform-actions">
                    <span
                        class="badge badge-secondary platform-status">
                        Disconnected
                    </span>
                    <button class="btn btn-danger platform-menu">
                        <span class="material-symbols-outlined">
                            delete
                        </span>
                    </button>
                </div>
            </div>
            <div class="platform-body">
                <div class="input-group">
                    <label class="input-label">
                        Channel
                    </label>
                    <input
                        class="input platform-channel"
                        type="text">
                </div>
            </div>
            <div class="platform-footer">
                <button
                    class="btn btn-success platform-connect">
                    Connect
                </button>
            </div>
        </div>
    </template>

    <template id="log-template">
        <div
            class="log-item"
            data-level="info">
            <div class="log-icon"></div>
            <div class="log-content">
                <div class="log-header">
                    <span class="log-title">
                        System
                    </span>
                    <span class="log-time">
                        00:00:00
                    </span>
                </div>
                <div class="log-message">
                    Message
                </div>
            </div>
        </div>
    </template>

    <template id="footer-platform-template">
        <div
            class="footer-platform"
            data-platform=""
            data-status="disconnected">
            <img
                class="footer-platform-icon"
                src=""
                alt="Platform">
            <span>
                Platform
            </span>
        </div>
    </template>
    <script type="module" src="renderer.js"></script>
</body>
</html>
